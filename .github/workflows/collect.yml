# 排程收集（選用）：每 6 小時在 GitHub 的雲端機器上自動抓一次資料。
# 資料庫存在獨立的 `data` 分支（每次覆蓋成單一 commit，避免 git 歷史越來越肥）。
# 私有 repo 每月有 2,000 分鐘免費額度；每次約 1–2 分鐘 × 每天 4 次 ≈ 每月 240 分鐘。
name: Scheduled collect

on:
  schedule:
    - cron: "17 */6 * * *"   # UTC 每 6 小時的第 17 分（避開整點尖峰）
  workflow_dispatch:          # 也可以在 Actions 頁面手動按 Run workflow

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore previous database from `data` branch (if any)
        run: |
          mkdir -p data
          if git fetch --depth 1 origin data 2>/dev/null; then
            git show origin/data:monitor.db > data/monitor.db && echo "restored $(du -h data/monitor.db)"
          else
            echo "no data branch yet — starting fresh"
          fi

      - name: Collect one cycle
        run: python -m frm.collector once

      - name: Daily history backfill (the 00:xx UTC run, or manual runs)
        run: |
          if [ "$(date -u +%H)" = "00" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m frm.collector backfill --days 3 || true
          fi

      - name: Push database to `data` branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/out && cp data/monitor.db /tmp/out/
          cd /tmp/out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor.db
          git commit -qm "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
